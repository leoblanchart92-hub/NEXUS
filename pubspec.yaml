name: nexus
description: "Nexus — une IA libre qui vit sur ton téléphone et apprend toute seule."
publish_to: 'none'
version: 0.8.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  # Vrai modèle de neurones, exécuté sur le téléphone par llama.cpp.
  flutter_edge_ai: ^2.5.5
  flutter_edge_ai_llama: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Force llama.cpp comme unique moteur natif embarqué (pas de LiteRT-LM).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
